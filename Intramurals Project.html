<!DOCTYPE html>
<html>
<head>
    <title>Intramurals Team Checker</title>
    <script>
        function checkEligibility() {
            // Get input values
            let registered = document.getElementById("registered").value;
            let medical = document.getElementById("medical").value;
            let grade = parseInt(document.getElementById("grade").value);
            let section = document.getElementById("section").value;
            let result = document.getElementById("result");

            // Clear previous result
            result.innerHTML = "";

            // Check conditions
            if (registered !== "yes") {
                result.innerHTML = "<p style='color:red;'>You are NOT eligible. Please register online first.</p>";
                return;
            }

            if (medical !== "yes") {
                result.innerHTML = "<p style='color:red;'>You are NOT eligible. Please secure a medical clearance.</p>";
                return;
            }

            if (grade < 7 || grade > 10 || isNaN(grade)) {
                result.innerHTML = "<p style='color:red;'>You are NOT eligible. Only Grades 7 - 10 students can join.</p>";
                return;
            }

            // Assign team randomly
            const teams = ["Blue Bears", "Red Bulldogs", "Yellow Tigers", "Green Hornets"];
            let assignedTeam = teams[Math.floor(Math.random() * teams.length)];

            // Display success message
            result.innerHTML = `
                <p style="color:green; font-weight:bold;">
                    🎉 Congratulations! You are eligible to join the Intramurals.
                </p>
                <p>Your Section: ${section}</p>
                <p>Your Assigned Team: <strong>${assignedTeam}</strong></p>
            `;
        }
    </script>
</head>

<body>

    <h2>Intramurals Team Checker</h2>

    <label>Online Registration Completed?</label>
    <select id="registered">
        <option value="">--Select--</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <br><br>

    <label>Medical Clearance Secured?</label>
    <select id="medical">
        <option value="">--Select--</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
    </select>

    <br><br>

    <label>Grade Level (7 - 10):</label>
    <input type="number" id="grade" min="7" max="10">

    <br><br>

    <label>Section:</label>
    <input type="text" id="section">

    <br><br>

    <button onclick="checkEligibility()">Check Eligibility</button>

    <br><br>

    <div id="result"></div>

</body>
</html>
